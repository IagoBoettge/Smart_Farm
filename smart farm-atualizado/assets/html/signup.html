<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </head>
  <audio autoplay loop>
    <source src="../audio/musica-pou.mp3" type="audio/mpeg">
</audio>
  <body>
    <div class="main">
      <h1>Cadastrar</h1>

      
      <div>
        <label id="labelNome" for="nome">Nome</label>
        <input type="text" id="nome" required />
      </div>
      
      <div>
        <label id="labelUsuario" for="usuario">Usuário</label>
        <input type="text" id="usuario" autocomplete="username" required />
      </div>
      
      <div>
        <label id="labelSenha" for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="new-password" required />
        
      </div>
      
      <div>
        <label id="labelConfirmSenha" for="confirmSenha">Confirmar Senha</label>
        <input type="password" id="confirmSenha" autocomplete="new-password" required />
        
      </div>
      
      <div id="msgError" aria-live="polite" hidden></div>
      <div id="msgSuccess" aria-live="polite" hidden></div>
      <div>
        <button type="button" onclick="cadastrar()">Cadastrar</button>
      </div>
    </div>

    <script>
      // Botões de mostrar/ocultar senha sem CSS externo
      document.addEventListener("DOMContentLoaded", function () {
        const senha = document.getElementById("senha");
        const btnSenha = document.getElementById("verSenha");
        btnSenha.addEventListener("click", () => {
          senha.type = senha.type === "password" ? "text" : "password";
        });

        const cSenha = document.getElementById("confirmSenha");
        const btnCSenha = document.getElementById("verConfirmSenha");
        btnCSenha.addEventListener("click", () => {
          cSenha.type = cSenha.type === "password" ? "text" : "password";
        });
      });
    </script>
    <script src="../js/signup.js"></script>
  </body>
</html>
